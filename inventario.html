<!doctype html>
<html lang="es">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>Inventario</title>

    <style>
        body{
            background-color: #6E675F;
        }

        .columna-producto {
            width: 35%;
        }

        .columna-precio {
            width: 20%;
        }

        .columna-stock {
            width: 15%;
        }

        .columna-acciones {
            width: 30%;
        }
    </style>
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">TecnoStore</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index.html">Menu Principal</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="#">Resumen</a>
            </li>
            <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Gestion del inventario
            </a>
            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                <li><a class="dropdown-item" href="inventario.html">Inventario  <i class="bi bi-archive"></i></a></li>
                <li><a class="dropdown-item" href="#">Agregar Producto</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="#">Movimientos</a></li>
            </ul>
            </li>
        </ul>
        <form class="d-flex">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-search text-muted"></i>
                </span>
                <input class="form-control border-start-0 ps-0" type="search" placeholder="Buscar producto" aria-label="Nombre Producto">
                <button class="btn btn-outline-success" type="submit">Buscar</button>
            </div>
        </form>
        </div>
    </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <h1>Inventario</h1>

            <button type="button" class="btn btn-secondary">
                Agregar Producto
            </button>
        </div>
        
        <div class="card">
            <div class="card-body">
                <table class="table table-borderless table-hover align-middle">
                    <thead>
                        <tr>
                            <th class="columna-producto">Producto</th>
                            <th class="columna-precio">Precio (ARS)</th>
                            <th class="columna-stock">Stock</th>
                            <th class="columna-acciones text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Producto 1</td>
                            <td>Precio 1</td>
                            <td>Stock 1</td>
                            <td>
                                <div  class="d-flex justify-content-center gap-2">
                                    <button class="btn btn-outline-success btn-sm" type="button">
                                        <i class="bi bi-pencil"></i> Editar
                                    </button>
                                    <button class="btn btn-outline-danger btn-sm" type="button">
                                        <i class="bi bi-trash"></i> Eliminar
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
                
    </div>
   



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
